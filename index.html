<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今日待办</title>
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日待办">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<!-- iOS 的桌面图标只认 PNG 的 apple-touch-icon，不认 SVG -->
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230b0d12'/%3E%3Cpath d='M48 92l28 28 56-64' fill='none' stroke='%2330d158' stroke-width='14' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f5f5f7; --card:#ffffff; --card2:#fbfbfd; --text:#1c1c1e; --sub:#6e6e73;
    --line:#e4e4e9; --accent:#0071e3; --danger:#d70015; --warn:#c25e00; --ok:#248a3d;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.045);
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b0d12; --card:#161922; --card2:#1c2029; --text:#f2f3f7; --sub:#9aa0ae;
           --line:#2a2f3a; --accent:#0a84ff; --danger:#ff453a; --warn:#ff9f0a; --ok:#30d158;
           --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.3); }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); min-height:100dvh;
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    padding:var(--safe-t) 0 calc(var(--safe-b) + 40px);
    -webkit-text-size-adjust:100%;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px}

  /* ---------- 抬头 ---------- */
  header{padding:14px 0 6px;display:flex;align-items:flex-start;gap:10px}
  .today-line{flex:1;min-width:0}
  .date{font-size:26px;font-weight:700;letter-spacing:.3px;line-height:1.15}
  .date small{font-size:14px;font-weight:500;color:var(--sub);margin-left:8px;letter-spacing:0}
  .subline{font-size:13.5px;color:var(--sub);margin-top:3px}
  .iconbtn{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:16px;
    background:var(--card);box-shadow:var(--shadow);color:var(--text);transition:transform .12s}
  .iconbtn:active{transform:scale(.9)}

  /* ---------- 概要条 ---------- */
  .tally{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px;font-size:13px}
  .tally span{padding:5px 11px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);color:var(--sub)}
  .tally b{color:var(--text);font-weight:600}
  .tally .hot{color:var(--danger);font-weight:600}
  .tally .warm{color:var(--warn);font-weight:600}

  /* ---------- 快速添加 ---------- */
  .quickadd{display:flex;gap:8px;margin-top:14px}
  .quickadd input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:12px;
    padding:12px 14px;font-size:16px;outline:none;box-shadow:var(--shadow)}
  .quickadd input:focus{border-color:var(--accent)}
  .quickadd button{flex:0 0 auto;width:48px;border-radius:12px;background:var(--accent);color:#fff;font-size:22px;
    font-weight:300;box-shadow:var(--shadow);transition:transform .12s}
  .quickadd button:active{transform:scale(.94)}
  .hintline{font-size:12.5px;color:var(--sub);margin:7px 2px 0}

  /* ---------- 分组 ---------- */
  .group{margin-top:20px}
  .ghead{display:flex;align-items:center;gap:8px;margin:0 4px 9px;font-size:13px;font-weight:600;
    color:var(--sub);letter-spacing:.4px}
  .ghead.crit{color:var(--danger)}
  .ghead .n{font-weight:500;opacity:.75}
  .ghead .line{flex:1;height:1px;background:var(--line)}

  .card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:8px;
    position:relative;overflow:hidden;padding:13px 14px}
  .card.overdue::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--danger)}
  .card.done{opacity:.48}
  .top{display:flex;gap:12px;align-items:flex-start}
  .tick{flex:0 0 auto;width:24px;height:24px;margin-top:1px;border-radius:50%;border:2px solid var(--line);
    display:grid;place-items:center;color:transparent;font-size:13px;transition:all .15s}
  .tick:active{transform:scale(.88)}
  .card.done .tick{background:var(--accent);border-color:var(--accent);color:#fff}
  .body{flex:1;min-width:0}
  .title{font-size:16.5px;font-weight:500;word-break:break-word;line-height:1.35}
  .card.done .title{text-decoration:line-through}
  .notes{font-size:13px;color:var(--sub);margin-top:4px;white-space:pre-wrap;word-break:break-word}
  .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px;padding-left:36px;font-size:12.5px}
  .metainfo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
  .metaacts{display:flex;gap:6px;flex:0 0 auto;margin-left:auto}
  .when{display:inline-flex;align-items:center;gap:5px;color:var(--sub);font-weight:500}
  .when.over{color:var(--danger);font-weight:600}
  .when.soon{color:var(--warn)}
  .tag{padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600;color:#fff}
  .rep{padding:2px 7px;border-radius:6px;font-size:11.5px;color:var(--sub);background:var(--card2);border:1px solid var(--line)}
  .spacer{flex:1 1 auto;min-width:0}
  .mini{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13.5px;
    background:var(--card2);color:var(--sub);border:1px solid var(--line)}
  .mini:active{transform:scale(.9)}
  .mini.gone:active{background:var(--danger);border-color:var(--danger);color:#fff}

  .none{text-align:center;padding:46px 18px;color:var(--sub)}
  .none .big{font-size:40px;margin-bottom:8px}
  .none .t{font-size:17px;font-weight:600;color:var(--text);margin-bottom:6px}
  .none .s{font-size:14px;line-height:1.6}
  .none button{margin-top:16px;padding:11px 20px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600}

  details.more{margin-top:18px}
  details.more>summary{list-style:none;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--sub);
    padding:10px 4px;display:flex;align-items:center;gap:6px}
  details.more>summary::-webkit-details-marker{display:none}
  details.more>summary::before{content:"▸";font-size:11px;transition:transform .15s}
  details.more[open]>summary::before{transform:rotate(90deg)}

  /* ---------- 弹层 ---------- */
  .sheet-wrap{position:fixed;inset:0;z-index:50;display:none}
  .sheet-wrap.open{display:block}
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .25s}
  .sheet-wrap.show .scrim{opacity:1}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:20px 20px 0 0;
    max-height:92dvh;display:flex;flex-direction:column;transform:translateY(100%);
    transition:transform .3s cubic-bezier(.32,.72,0,1);padding-bottom:var(--safe-b)}
  .sheet-wrap.show .sheet{transform:translateY(0)}
  @media (min-width:760px){
    .sheet{left:50%;right:auto;bottom:auto;top:50%;width:560px;transform:translate(-50%,-46%);
      border-radius:20px;max-height:88dvh}
    .sheet-wrap.show .sheet{transform:translate(-50%,-50%)}
  }
  .shead{display:flex;align-items:center;gap:8px;padding:15px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .shead h2{margin:0;font-size:17px;font-weight:700;flex:1;text-align:center}
  .shead button{font-size:15px;font-weight:600;color:var(--accent);padding:6px 2px;min-width:52px}
  .shead button.cancel{color:var(--sub);text-align:left}
  .sbody{padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}

  .box{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);min-height:52px}
  .row:last-child{border-bottom:0}
  .row>label{flex:0 0 66px;font-size:15px;color:var(--sub)}
  .row input[type=text],.row input[type=datetime-local],.row textarea{flex:1;min-width:0;border:0;background:transparent;
    outline:none;font-size:16px;padding:2px 0}
  .row textarea{resize:none;line-height:1.5;font-family:inherit}
  .quick{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px}
  .quick button{padding:8px 13px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13.5px}
  .quick button:active{transform:scale(.95)}
  .seg{display:flex;gap:6px;flex-wrap:wrap;flex:1;justify-content:flex-end}
  .seg button{padding:7px 12px;border-radius:9px;background:var(--card2);border:1px solid var(--line);font-size:13.5px}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .catpick{display:flex;gap:8px;flex-wrap:wrap;flex:1}
  .catpick button{padding:7px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:13.5px}
  .catpick button.on{color:#fff;font-weight:600;border-color:transparent}
  .sec{font-size:13px;font-weight:600;color:var(--sub);margin:18px 4px 8px;letter-spacing:.3px}
  .note{font-size:12.5px;color:var(--sub);line-height:1.65;padding:10px 4px 0}
  .note code{background:var(--card2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12px}
  .codebox{width:100%;height:190px;border:1px solid var(--line);background:var(--card2);border-radius:10px;
    padding:11px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical;outline:none}
  .btnrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .btnrow button{flex:1;min-width:120px;padding:12px;border-radius:11px;background:var(--card);box-shadow:var(--shadow);
    font-size:14.5px;font-weight:600;border:1px solid var(--line)}
  .btnrow button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .status{font-size:12.5px;padding:10px 12px;border-radius:10px;margin-top:12px;line-height:1.6;
    background:var(--card);box-shadow:var(--shadow)}
  .status.warn{color:var(--warn)}
  .status.ok{color:var(--ok)}

  .toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 30px);transform:translate(-50%,14px);z-index:80;
    background:rgba(28,28,30,.94);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;max-width:86vw;
    text-align:center;opacity:0;pointer-events:none;transition:all .25s}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="today-line">
      <div class="date" id="dateMain">今天</div>
      <div class="subline" id="dateSub"></div>
    </div>
    <button class="iconbtn" id="btnReload" title="刷新">↻</button>
    <button class="iconbtn" id="btnData" title="数据">⋯</button>
  </header>

  <div class="tally" id="tally"></div>

  <div class="quickadd">
    <input type="text" id="quickInput" placeholder="快速记一件事…" autocomplete="off" enterkeyhint="done">
    <button id="quickBtn" title="添加">＋</button>
  </div>
  <div class="hintline" id="quickHint"></div>

  <main id="list"></main>
</div>

<!-- 编辑 / 新建 -->
<div class="sheet-wrap" id="editSheet">
  <div class="scrim" data-close></div>
  <div class="sheet">
    <div class="shead">
      <button class="cancel" data-close>取消</button>
      <h2 id="editTitle">新建任务</h2>
      <button id="btnSave">保存</button>
    </div>
    <div class="sbody">
      <div class="box">
        <div class="row"><input type="text" id="fTitle" placeholder="要做什么？" autocomplete="off"></div>
        <div class="row"><label>截止</label><input type="datetime-local" id="fDue"></div>
        <div class="row" style="padding:9px 14px">
          <div class="quick" style="padding:0;width:100%">
            <button data-due="today18">今天 18:00</button>
            <button data-due="tonight">今晚 21:00</button>
            <button data-due="tomorrow9">明天 9:00</button>
            <button data-due="weekend">本周末</button>
            <button data-due="none">不设时间</button>
          </div>
        </div>
      </div>

      <div class="sec">分类</div>
      <div class="box"><div class="row"><div class="catpick" id="fCats"></div></div></div>

      <div class="sec">重复</div>
      <div class="box"><div class="row"><div class="seg" id="fRepeat">
        <button data-rep="none">不重复</button>
        <button data-rep="daily">每天</button>
        <button data-rep="weekly">每周</button>
        <button data-rep="monthly">每月</button>
      </div></div></div>

      <div class="sec">备注</div>
      <div class="box"><div class="row"><textarea id="fNotes" rows="2" placeholder="可选"></textarea></div></div>

      <div class="note" id="editNote"></div>
    </div>
  </div>
</div>

<!-- 数据 -->
<div class="sheet-wrap" id="dataSheet">
  <div class="scrim" data-close></div>
  <div class="sheet">
    <div class="shead">
      <button class="cancel" data-close>关闭</button>
      <h2>数据</h2>
      <button id="btnCopy">复制</button>
    </div>
    <div class="sbody">
      <div class="status" id="storeStatus"></div>

      <div class="sec">当前数据（可复制回 HTML 文件长期保存）</div>
      <textarea class="codebox" id="jsonBox" readonly spellcheck="false"></textarea>
      <div class="btnrow">
        <button id="btnSelectAll">全选</button>
        <button id="btnExport">下载备份</button>
      </div>

      <div class="sec">粘贴数据以覆盖</div>
      <textarea class="codebox" id="pasteBox" placeholder="在这里粘贴之前复制出去的 JSON" spellcheck="false"></textarea>
      <div class="btnrow">
        <button class="primary" id="btnImport">用这段数据覆盖</button>
      </div>

      <div class="note">
        <b>想长期保存自己加的任务？</b><br>
        1. 点右上「复制」，把内容粘到手机备忘录里存着；<br>
        2. 或者在电脑上打开这个 HTML，把 <code>id="taskData"</code> 那段内容替换成复制的 JSON；<br>
        3. 再把这个文件传回手机即可。这样即使换手机、清缓存也不会丢。
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".json,application/json" style="display:none">

<!-- ============================================================
     任务数据：直接改这里就能改任务，不需要任何服务器或账号。
     due 留空字符串表示"不设时间"。格式 2026-10-04T09:00
     cat 对应下面 cats 里的 id
     ============================================================ -->
<script type="application/json" id="taskData">
{
  "builtAt": "2026-10-03T16:40:00",
  "cats": [
    { "id": "work", "name": "工作", "color": "#0a84ff" },
    { "id": "study", "name": "学习", "color": "#30d158" },
    { "id": "life", "name": "生活", "color": "#ff9f0a" },
    { "id": "other", "name": "其他", "color": "#bf5af2" }
  ],
  "tasks": [
    { "id": "d1", "title": "把这份文件传到手机上打开试试", "cat": "other", "due": "", "repeat": "none", "notes": "这是示例任务，点 ✎ 改掉或点 ✕ 删掉都行" },
    { "id": "d2", "title": "提交本周周报", "cat": "work", "due": "2026-10-03T18:00", "repeat": "weekly", "notes": "写上本周进展和下周计划" },
    { "id": "d3", "title": "读 20 页书", "cat": "study", "due": "2026-10-03T21:00", "repeat": "daily", "notes": "" },
    { "id": "d4", "title": "交房租", "cat": "life", "due": "2026-10-04T09:00", "repeat": "monthly", "notes": "" },
    { "id": "d5", "title": "预约牙医", "cat": "life", "due": "2026-10-02T15:00", "repeat": "none", "notes": "已经过期了，会显示成红色" }
  ]
}
</script>

<script>
(function(){
"use strict";

/* ========== 基础工具 ========== */
var WEEK = ["周日","周一","周二","周三","周四","周五","周六"];
var LS_KEY = "todayTodos.v1";
var DAY = 86400000;

function pad(n){ return n < 10 ? "0" + n : "" + n; }
function uid(){ return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
function sod(d){ var x = new Date(d); x.setHours(0,0,0,0); return x; }
function dayDiff(a,b){ return Math.round((sod(a) - sod(b)) / DAY); }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function parseDue(s){
  if (!s) return 0;
  var t = new Date(String(s).replace(" ", "T")).getTime();
  return isNaN(t) ? 0 : t;
}
function toInput(ms){ var d = new Date(ms); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes()); }
function toISO(ms){ return toInput(ms); }
function timeOf(ms){ var d = new Date(ms); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function dayLabel(ms){
  var d = new Date(ms), diff = dayDiff(d, new Date());
  if (diff === 0) return "今天";
  if (diff === 1) return "明天";
  if (diff === 2) return "后天";
  if (diff === -1) return "昨天";
  if (diff === -2) return "前天";
  if (diff > 0 && diff <= 6) return WEEK[d.getDay()];
  return (d.getMonth()+1) + "月" + d.getDate() + "日 " + WEEK[d.getDay()];
}
function whenText(ms){
  var d = new Date(ms), diff = dayDiff(d, new Date());
  if (diff === 0) return "今天 " + timeOf(ms);
  if (diff === 1) return "明天 " + timeOf(ms);
  return (d.getMonth()+1) + "月" + d.getDate() + "日 " + timeOf(ms);
}
function countdown(ms){
  var diff = ms - Date.now(), a = Math.abs(diff), m = Math.round(a/60000), s;
  if (m < 1) s = "不到 1 分钟";
  else if (m < 60) s = m + " 分钟";
  else if (m < 1440){ var h = Math.floor(m/60), r = m%60; s = h + " 小时" + (r ? " " + r + " 分" : ""); }
  else s = Math.round(m/1440) + " 天";
  return diff >= 0 ? "还有 " + s : "已过 " + s;
}
function tomorrow9(){ var d = new Date(); d.setDate(d.getDate()+1); d.setHours(9,0,0,0); return d.getTime(); }
function download(name, text, mime){
  try{
    var blob = new Blob([text], { type:(mime||"text/plain") + ";charset=utf-8" });
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
    return true;
  }catch(e){ return false; }
}

/* ========== 读入内嵌数据 ========== */
var embedded = { builtAt:"", cats:[], tasks:[] };
try{
  var raw = document.getElementById("taskData").textContent;
  var parsed = JSON.parse(raw);
  if (parsed && Array.isArray(parsed.tasks)) embedded = parsed;
}catch(e){
  console.error("内嵌任务数据解析失败", e);
}

function defaults(){ return { tasks: [], cats: [] }; }
var EMBED = {
  builtAt: embedded.builtAt || "",
  cats: Array.isArray(embedded.cats) ? embedded.cats : [],
  tasks: (embedded.tasks || []).map(function(t){
    return { id:t.id || uid(), title:t.title || "(未命名)", notes:t.notes || "", cat:t.cat || "",
             dueAt: parseDue(t.due), repeat: t.repeat || "none", doneAt: 0 };
  })
};

/* ========== 状态 + 存储 ========== */
var state = { tasks: [], cats: [], view: "today", storeOK: true };

function loadStored(){
  try{
    var s = localStorage.getItem(LS_KEY);
    if (!s) return null;
    var d = JSON.parse(s);
    if (!d || !Array.isArray(d.tasks)) return null;
    return d;
  }catch(e){ return null; }
}
function saveStored(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({ builtAt: EMBED.builtAt, cats: state.cats, tasks: state.tasks }));
    state.storeOK = true;
  }catch(e){
    state.storeOK = false;
  }
}

function boot(){
  var stored = loadStored();
  var storedFresh = stored && stored.builtAt && EMBED.builtAt && stored.builtAt >= EMBED.builtAt;
  var useStored = !!stored && (storedFresh || !EMBED.builtAt);
  if (useStored){
    state.tasks = stored.tasks.map(function(t){
      return { id:t.id || uid(), title:t.title || "(未命名)", notes:t.notes || "", cat:t.cat || "",
               dueAt: typeof t.dueAt === "number" ? t.dueAt : parseDue(t.due),
               repeat: t.repeat || "none", doneAt: t.doneAt || 0 };
    });
    state.cats = Array.isArray(stored.cats) && stored.cats.length ? stored.cats : EMBED.cats.slice();
  } else {
    state.tasks = EMBED.tasks.map(function(t){ return JSON.parse(JSON.stringify(t)); });
    state.cats = EMBED.cats.slice();
    if (stored && !storedFresh && EMBED.builtAt){
      // 文件比本机记录新：采用文件里的数据，并覆盖本机记录
      saveStored();
    }
  }
  if (!state.cats.length){
    state.cats = [{ id:"work", name:"工作", color:"#0a84ff" }];
  }
}

function catOf(id){
  for (var i=0;i<state.cats.length;i++) if (state.cats[i].id === id) return state.cats[i];
  return null;
}
function catName(id){ var c = catOf(id); return c ? c.name : "未分类"; }
function catColor(id){ var c = catOf(id); return c ? c.color : "#8e8e93"; }
function isDone(t){ return !!t.doneAt; }
function findTask(id){ for (var i=0;i<state.tasks.length;i++) if (state.tasks[i].id === id) return state.tasks[i]; return null; }

function nextRepeat(ms, rep){
  var d = new Date(ms);
  if (rep === "daily") d.setDate(d.getDate()+1);
  else if (rep === "weekly") d.setDate(d.getDate()+7);
  else if (rep === "monthly") d.setMonth(d.getMonth()+1);
  else return 0;
  return d.getTime();
}

/* ========== 渲染 ========== */
var el = {
  dateMain: document.getElementById("dateMain"),
  dateSub: document.getElementById("dateSub"),
  tally: document.getElementById("tally"),
  list: document.getElementById("list"),
  quickInput: document.getElementById("quickInput"),
  quickHint: document.getElementById("quickHint"),
  toast: document.getElementById("toast")
};

function renderHeader(){
  var d = new Date();
  el.dateMain.innerHTML = (d.getMonth()+1) + "月" + d.getDate() + "日" +
    '<small>' + WEEK[d.getDay()] + ' ' + timeOf(d.getTime()) + '</small>';
  var pending = state.tasks.filter(function(t){ return !isDone(t); });
  var over = pending.filter(function(t){ return t.dueAt && t.dueAt < Date.now(); }).length;
  var today = pending.filter(function(t){
    return t.dueAt && t.dueAt >= Date.now() && dayDiff(t.dueAt, new Date()) === 0;
  }).length;
  var left = pending.filter(function(t){
    return t.dueAt && dayDiff(t.dueAt, new Date()) === 0 && t.dueAt < Date.now();
  }).length;
  var todayAll = today + left;
  var h = "";
  if (over) h += '<span><span class="hot">逾期 ' + over + '</span></span>';
  h += '<span>今天还有 <b>' + todayAll + '</b> 件</span>';
  h += '<span>待办 <b>' + pending.length + '</b></span>';
  el.tally.innerHTML = h;
  el.dateSub.textContent = pending.length
    ? (over ? "有 " + over + " 件已经逾期" : "打开就能看到今天要做的事")
    : "暂时没有待办";
}

function cardHTML(t){
  var done = isDone(t), now = Date.now();
  var over = !done && t.dueAt && t.dueAt < now;
  var cls = "when";
  var text;
  if (t.dueAt){
    text = whenText(t.dueAt);
    if (!done){
      text += " · " + countdown(t.dueAt);
      if (over) cls += " over";
      else if (dayDiff(t.dueAt, new Date()) === 0) cls += " soon";
    }
  } else {
    text = "不设时间";
  }
  var rep = (t.repeat && t.repeat !== "none")
    ? '<span class="rep">' + ({daily:"每天",weekly:"每周",monthly:"每月"}[t.repeat] || "") + '</span>' : "";

  return '<div class="card' + (over ? " overdue" : "") + (done ? " done" : "") + '" data-id="' + esc(t.id) + '">' +
    '<div class="top">' +
      '<button class="tick" data-act="toggle" aria-label="完成">✓</button>' +
      '<div class="body">' +
        '<div class="title">' + esc(t.title) + '</div>' +
        (t.notes ? '<div class="notes">' + esc(t.notes) + '</div>' : "") +
      '</div>' +
    '</div>' +
    '<div class="meta">' +
      '<span class="metainfo">' +
        '<span class="' + cls + '">🕘 ' + esc(text) + '</span>' +
        '<span class="tag" style="background:' + esc(catColor(t.cat)) + '">' + esc(catName(t.cat)) + '</span>' +
        rep +
      '</span>' +
      '<span class="metaacts">' +
        (!done && t.dueAt ? '<button class="mini" data-act="later" title="推到明天 9:00">→</button>' : "") +
        '<button class="mini" data-act="edit" title="编辑">✎</button>' +
        '<button class="mini gone" data-act="del" title="删除">✕</button>' +
      '</span>' +
    '</div>' +
  '</div>';
}

function groupHTML(title, tasks, critical){
  if (!tasks.length) return "";
  return '<div class="group"><div class="ghead' + (critical ? " crit" : "") + '">' + title +
    ' <span class="n">' + tasks.length + '</span><span class="line"></span></div>' +
    tasks.map(cardHTML).join("") + '</div>';
}

function render(){
  renderHeader();

  var pending = state.tasks.filter(function(t){ return !isDone(t); });
  var doneToday = state.tasks.filter(function(t){ return isDone(t); });
  var now = Date.now();

  function byDue(a,b){
    if (!a.dueAt && !b.dueAt) return 0;
    if (!a.dueAt) return 1;
    if (!b.dueAt) return -1;
    return a.dueAt - b.dueAt;
  }
  var over   = pending.filter(function(t){ return t.dueAt && t.dueAt < now; }).sort(byDue);
  var today  = pending.filter(function(t){ return t.dueAt && t.dueAt >= now && dayDiff(t.dueAt, new Date()) === 0; }).sort(byDue);
  var tmr    = pending.filter(function(t){ return t.dueAt && dayDiff(t.dueAt, new Date()) === 1; }).sort(byDue);
  var later  = pending.filter(function(t){ return t.dueAt && dayDiff(t.dueAt, new Date()) >= 2; }).sort(byDue);
  var noDue  = pending.filter(function(t){ return !t.dueAt; });

  var html = "";

  if (state.view === "today"){
    if (!over.length && !today.length && !tmr.length){
      html += '<div class="none"><div class="big">🌿</div><div class="t">今天没有安排</div>' +
              '<div class="s">上面输入框里写点什么，回车就能加一条。</div>' +
              (later.length || noDue.length ? '<button data-view="all">看看后面还有什么</button>' : '') + '</div>';
    }
    html += groupHTML("已逾期", over, true);
    html += groupHTML("今天", today, false);
    html += groupHTML("明天", tmr, false);
    if (later.length || noDue.length){
      var n = later.length + noDue.length;
      html += '<details class="more"><summary>后面还有 ' + n + ' 件（包括没设时间的）</summary>';
      html += groupHTML("本周内", later.filter(function(t){ return dayDiff(t.dueAt, new Date()) <= 7; }), false);
      html += groupHTML("更晚", later.filter(function(t){ return dayDiff(t.dueAt, new Date()) > 7; }), false);
      html += groupHTML("没设时间", noDue, false);
      html += '</details>';
    }
  } else if (state.view === "all"){
    var cats = {};
    pending.forEach(function(t){ var k = t.cat || ""; (cats[k] = cats[k] || []).push(t); });
    var any = false;
    state.cats.forEach(function(c){
      var arr = (cats[c.id] || []).sort(byDue);
      if (!arr.length) return;
      any = true;
      html += '<div class="group"><div class="ghead"><span style="width:9px;height:9px;border-radius:50%;background:' +
        esc(c.color) + ';display:inline-block"></span>' + esc(c.name) +
        ' <span class="n">' + arr.length + '</span><span class="line"></span></div>' +
        arr.map(cardHTML).join("") + '</div>';
    });
    if (cats[""] && cats[""].length){
      any = true;
      html += groupHTML("未分类", cats[""].sort(byDue), false);
    }
    if (!any) html += '<div class="none"><div class="big">🌿</div><div class="t">没有待办</div></div>';
  } else {
    if (!doneToday.length){
      html += '<div class="none"><div class="big">🎉</div><div class="t">还没有完成的任务</div>' +
              '<div class="s">勾掉一条就会出现在这里。</div></div>';
    } else {
      html += groupHTML("已完成 " + doneToday.length + " 件", doneToday.sort(function(a,b){ return b.doneAt - a.doneAt; }), false);
    }
  }

  var views = '<div class="group" style="margin-top:22px"><div class="ghead">切换视图<span class="line"></span></div>' +
    '<div class="quick" style="padding:0">' +
    '<button data-view="today" class="' + (state.view === "today" ? "on" : "") + '" style="' +
      (state.view === "today" ? "background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600" : "") + '">今天</button>' +
    '<button data-view="all" class="' + (state.view === "all" ? "on" : "") + '" style="' +
      (state.view === "all" ? "background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600" : "") + '">按分类</button>' +
    '<button data-view="done" class="' + (state.view === "done" ? "on" : "") + '" style="' +
      (state.view === "done" ? "background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600" : "") + '">已完成</button>' +
    '</div></div>';
  html += views;

  el.list.innerHTML = html;
  el.quickHint.textContent = state.storeOK
    ? "回车或点 ＋ 添加。改动只存在这台设备上（见右上角 ⋯ 可复制出来长期保存）。"
    : "注意：这台设备的浏览器不允许本地保存，刷新后改动会丢失。请用右上角 ⋯ 把数据复制出去。";
}

/* ========== 交互 ========== */
var toastTimer = null;
function toast(msg){
  el.toast.textContent = msg;
  el.toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.toast.classList.remove("show"); }, 2600);
}

function quickAdd(){
  var v = el.quickInput.value.trim();
  if (!v) return;
  var dueAt = 0, title = v;
  // 支持在文字里写时间关键词，例如 "交报告 18:00" / "买菜 明天"
  var m = v.match(/^(.*?)\s+(\d{1,2})[:：](\d{2})$/);
  if (m){
    title = m[1].trim() || v;
    var d = new Date();
    d.setHours(Number(m[2]), Number(m[3]), 0, 0);
    dueAt = d.getTime();
    if (dueAt < Date.now()) dueAt += DAY;
  } else if (/\s*明天\s*$/.test(v)){
    title = v.replace(/\s*明天\s*$/, "").trim() || v;
    dueAt = tomorrow9();
  } else if (/\s*今晚\s*$/.test(v)){
    title = v.replace(/\s*今晚\s*$/, "").trim() || v;
    var t = new Date(); t.setHours(21,0,0,0);
    dueAt = t.getTime();
    if (dueAt < Date.now()) dueAt += DAY;
  }
  state.tasks.push({ id:uid(), title:title, notes:"", cat:(state.cats[0] ? state.cats[0].id : ""),
                     dueAt:dueAt, repeat:"none", doneAt:0 });
  saveStored();
  el.quickInput.value = "";
  render();
  toast(dueAt ? "已添加：" + whenText(dueAt) : "已添加（没设时间）");
}
function toggleTask(id){
  var t = findTask(id); if (!t) return;
  if (isDone(t)){ t.doneAt = 0; }
  else {
    t.doneAt = Date.now();
    if (t.repeat && t.repeat !== "none" && t.dueAt){
      var nxt = nextRepeat(t.dueAt, t.repeat);
      while (nxt <= Date.now()) nxt = nextRepeat(nxt, t.repeat);
      state.tasks.push({ id:uid(), title:t.title, notes:t.notes, cat:t.cat,
                         dueAt:nxt, repeat:t.repeat, doneAt:0 });
      toast("完成，下次：" + whenText(nxt));
    }
  }
  saveStored(); render();
}
function delTask(id){
  var t = findTask(id); if (!t) return;
  if (!confirm("删除「" + t.title + "」？")) return;
  state.tasks = state.tasks.filter(function(x){ return x.id !== id; });
  saveStored(); render(); toast("已删除");
}
function pushToTomorrow(id){
  var t = findTask(id); if (!t) return;
  t.dueAt = tomorrow9();
  saveStored(); render(); toast("已推到明天 9:00");
}

/* ========== 编辑弹层 ========== */
var editing = null, draft = { cat:"", repeat:"none", dueAt:0 };
var editSheet = document.getElementById("editSheet");

function show(wrap){ wrap.classList.add("open"); requestAnimationFrame(function(){ wrap.classList.add("show"); }); }
function close(wrap){ wrap.classList.remove("show"); setTimeout(function(){ wrap.classList.remove("open"); }, 300); }
document.addEventListener("click", function(e){
  var c = e.target.closest("[data-close]");
  if (c){ var w = c.closest(".sheet-wrap"); if (w) close(w); }
});

function renderCatPick(){
  var h = state.cats.map(function(c){
    var on = draft.cat === c.id;
    return '<button data-cat="' + esc(c.id) + '" class="' + (on ? "on" : "") + '"' +
      (on ? ' style="background:' + esc(c.color) + '"' : '') + '>' + esc(c.name) + '</button>';
  }).join("");
  h += '<button data-cat="" class="' + (draft.cat === "" ? "on" : "") + '"' +
       (draft.cat === "" ? ' style="background:#8e8e93"' : '') + '>未分类</button>';
  document.getElementById("fCats").innerHTML = h;
}
function renderRepeatPick(){
  Array.prototype.forEach.call(document.querySelectorAll("#fRepeat button"), function(b){
    b.classList.toggle("on", (b.getAttribute("data-rep") || "none") === draft.repeat);
  });
}
function openEdit(t){
  editing = t ? t.id : null;
  draft.cat = t ? (t.cat || "") : (state.cats[0] ? state.cats[0].id : "");
  draft.repeat = t ? (t.repeat || "none") : "none";
  draft.dueAt = t ? (t.dueAt || 0) : 0;
  document.getElementById("editTitle").textContent = t ? "编辑" : "新建";
  document.getElementById("fTitle").value = t ? t.title : "";
  document.getElementById("fNotes").value = t ? (t.notes || "") : "";
  document.getElementById("fDue").value = t && t.dueAt ? toInput(t.dueAt) : (draft.dueAt ? toInput(draft.dueAt) : "");
  document.getElementById("editNote").textContent = t
    ? "" : "提示：也可以直接用上面的输入框快速添加，不用打开这个窗口。";
  renderCatPick(); renderRepeatPick();
  show(editSheet);
  setTimeout(function(){ document.getElementById("fTitle").focus(); }, 320);
}
function saveEdit(){
  var title = document.getElementById("fTitle").value.trim();
  if (!title){ toast("请填写内容"); return; }
  var v = document.getElementById("fDue").value;
  var dueAt = v ? new Date(v).getTime() : 0;
  if (v && isNaN(dueAt)){ toast("时间格式不对"); return; }
  var notes = document.getElementById("fNotes").value.trim();
  if (editing){
    var t = findTask(editing);
    if (t){ t.title = title; t.notes = notes; t.cat = draft.cat; t.dueAt = dueAt; t.repeat = draft.repeat; }
    toast("已保存");
  } else {
    state.tasks.push({ id:uid(), title:title, notes:notes, cat:draft.cat, dueAt:dueAt, repeat:draft.repeat, doneAt:0 });
    toast("已添加");
  }
  saveStored(); render(); close(editSheet);
}

/* ========== 数据面板 ========== */
var dataSheet = document.getElementById("dataSheet");
function currentJSON(){
  return JSON.stringify({
    builtAt: toISO(Date.now()),
    cats: state.cats,
    tasks: state.tasks.map(function(t){
      var o = { id:t.id, title:t.title, cat:t.cat, due: t.dueAt ? toISO(t.dueAt) : "", repeat:t.repeat };
      if (t.notes) o.notes = t.notes;
      if (t.doneAt) o.done = 1;
      return o;
    })
  }, null, 2);
}
function openData(){
  document.getElementById("jsonBox").value = currentJSON();
  document.getElementById("pasteBox").value = "";
  var s = document.getElementById("storeStatus");
  if (state.storeOK){
    s.className = "status ok";
    s.textContent = "这台设备可以本地保存：在这里做的改动，下次打开还在。";
  } else {
    s.className = "status warn";
    s.textContent = "这台设备的浏览器不允许本地保存，改动在刷新后会丢失 —— 请把下面的内容复制出去保存。";
  }
  show(dataSheet);
}

/* ========== 事件 ========== */
document.getElementById("quickBtn").addEventListener("click", quickAdd);
el.quickInput.addEventListener("keydown", function(e){
  if (e.key === "Enter"){ e.preventDefault(); quickAdd(); }
});
document.getElementById("btnReload").addEventListener("click", function(){
  render(); toast("已按当前时间刷新");
});
document.getElementById("btnData").addEventListener("click", openData);

el.list.addEventListener("click", function(e){
  var b = e.target.closest("[data-view]");
  if (b){ state.view = b.getAttribute("data-view"); render(); return; }
  var card = e.target.closest(".card"); if (!card) return;
  var id = card.getAttribute("data-id");
  var act = e.target.closest("[data-act]");
  var a = act ? act.getAttribute("data-act") : "";
  if (a === "toggle") toggleTask(id);
  else if (a === "del") delTask(id);
  else if (a === "later") pushToTomorrow(id);
  else if (a === "edit"){ var t = findTask(id); if (t) openEdit(t); }
});

document.querySelectorAll('[data-due]').forEach(function(b){
  b.addEventListener("click", function(){
    var k = b.getAttribute("data-due"), d = new Date(), ms = 0;
    if (k === "today18"){ d.setHours(18,0,0,0); ms = d.getTime(); if (ms < Date.now()) ms += DAY; }
    else if (k === "tonight"){ d.setHours(21,0,0,0); ms = d.getTime(); if (ms < Date.now()) ms += DAY; }
    else if (k === "tomorrow9"){ ms = tomorrow9(); }
    else if (k === "weekend"){ var add = (6 - d.getDay() + 7) % 7; if (!add) add = 7; d.setDate(d.getDate()+add); d.setHours(10,0,0,0); ms = d.getTime(); }
    draft.dueAt = ms;
    document.getElementById("fDue").value = ms ? toInput(ms) : "";
  });
});
document.getElementById("fCats").addEventListener("click", function(e){
  var b = e.target.closest("[data-cat]"); if (!b) return;
  draft.cat = b.getAttribute("data-cat"); renderCatPick();
});
document.getElementById("fRepeat").addEventListener("click", function(e){
  var b = e.target.closest("[data-rep]"); if (!b) return;
  draft.repeat = b.getAttribute("data-rep"); renderRepeatPick();
});
document.getElementById("btnSave").addEventListener("click", saveEdit);
document.getElementById("fTitle").addEventListener("keydown", function(e){
  if (e.key === "Enter"){ e.preventDefault(); saveEdit(); }
});

document.getElementById("btnCopy").addEventListener("click", function(){
  var box = document.getElementById("jsonBox");
  box.focus(); box.select();
  var ok = false;
  try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
  if (!ok && navigator.clipboard){
    navigator.clipboard.writeText(box.value).then(function(){ toast("已复制"); }, function(){ toast("请长按选中后手动复制"); });
    return;
  }
  toast(ok ? "已复制到剪贴板" : "请长按选中后手动复制");
});
document.getElementById("btnSelectAll").addEventListener("click", function(){
  var box = document.getElementById("jsonBox");
  box.focus(); box.select();
  toast("已全选，长按选择「拷贝」");
});
document.getElementById("btnExport").addEventListener("click", function(){
  if (download("今日待办备份.json", currentJSON(), "application/json")) toast("已下载备份");
  else toast("这个环境不支持下载，请用「复制」");
});
document.getElementById("btnImport").addEventListener("click", function(){
  var v = document.getElementById("pasteBox").value.trim();
  if (!v){ toast("先粘贴数据"); return; }
  var d;
  try{ d = JSON.parse(v); }catch(e){ toast("JSON 格式不对"); return; }
  if (!d || !Array.isArray(d.tasks)){ toast("数据里没有 tasks 数组"); return; }
  if (!confirm("用这段数据覆盖当前的 " + state.tasks.length + " 条任务？")) return;
  state.tasks = d.tasks.map(function(t){
    return { id:t.id || uid(), title:t.title || "(未命名)", notes:t.notes || "", cat:t.cat || "",
             dueAt: typeof t.dueAt === "number" ? t.dueAt : parseDue(t.due),
             repeat: t.repeat || "none", doneAt: t.done ? Date.now() : (t.doneAt || 0) };
  });
  if (Array.isArray(d.cats) && d.cats.length) state.cats = d.cats;
  saveStored(); render(); openData(); toast("已覆盖");
});

/* 定时刷新倒计时文字（不改数据，只重画） */
setInterval(function(){ if (!document.hidden && state.view === "today") render(); }, 60000);
document.addEventListener("visibilitychange", function(){ if (!document.hidden) render(); });

try{
  localStorage.setItem(LS_KEY + ".probe", "1");
  localStorage.removeItem(LS_KEY + ".probe");
  state.storeOK = true;
}catch(e){ state.storeOK = false; }

boot();
if (!state.tasks.length && !EMBED.tasks.length){
  state.tasks.push({ id:uid(), title:"写下一件今天要做的事", notes:"点卡片上的 ✎ 可以改时间、分类和备注",
                     cat:"", dueAt:0, repeat:"none", doneAt:0 });
}

/* 支持 manifest 里的快捷方式，例如 ./?view=all */
try{
  var qv = new URLSearchParams(location.search).get("view");
  if (qv === "all" || qv === "done" || qv === "today") state.view = qv;
}catch(e){}

render();

/* 注册 Service Worker —— 这是 PWA 能安装的前提。
   只在 http/https 下注册；file:// 直接打开时静默跳过，
   所以同一个文件依然可以放在手机里离线用。 */
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js", { scope:"./" })
      .then(function(reg){
        window.__swReg = reg;
        console.log("PWA: Service Worker 已注册，范围 " + reg.scope);
      })
      .catch(function(e){
        console.warn("PWA: Service Worker 注册失败（应用本身不受影响）", e.message);
      });
  });
}
})();
</script>
</body>
</html>
